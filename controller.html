<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Aura Controller</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0b0c10;
    --panel: #16181f;
    --card: #1c1f2a;
    --card-border: rgba(255, 255, 255, 0.08);
    --accent: #ff9f0a;
    --accent-bg: rgba(255, 159, 10, 0.15);
    --text: #ffffff;
    --muted: #8e929f;
    --green: #30d158;
    --red: #ff453a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    overflow-x: hidden; -webkit-user-select: none; user-select: none;
  }
  body {
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; flex-direction: column; gap: 14px; max-width: 520px; margin: 0 auto;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 4px;
  }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
  .status-pill {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--card-border);
    display: flex; align-items: center; gap: 7px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  .status-pill.online { color: var(--green); border-color: rgba(48, 209, 88, 0.3); }
  .status-pill.online .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-pill.waiting { color: var(--accent); border-color: rgba(255, 159, 10, 0.3); }
  .status-pill.waiting .dot { background: var(--accent); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .card {
    background: var(--panel); border: 1px solid var(--card-border);
    border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .card-title {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center;
  }

  /* Spectator Live Peek Screen */
  .peek-screen {
    background: #000; border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px; padding: 14px 18px; text-align: right;
    min-height: 84px; display: flex; flex-direction: column; justify-content: center;
    position: relative;
  }
  .peek-sec {
    font: 14px ui-monospace, Menlo, monospace; color: var(--muted);
    min-height: 18px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .peek-prim {
    font: 300 42px/1.1 ui-monospace, Menlo, monospace; color: #fff;
    letter-spacing: -1px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .peek-tag {
    position: absolute; top: 10px; left: 12px; font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .peek-tag.unlocked { background: rgba(48, 209, 88, 0.18); color: var(--green); }
  .peek-tag.locked { background: rgba(255, 159, 10, 0.22); color: var(--accent); }

  /* Modes grid */
  .btn-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  button {
    font: inherit; border: 0; border-radius: 12px; cursor: pointer;
    padding: 12px; font-weight: 600; font-size: 14px; transition: transform 0.08s ease, background 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-mode {
    background: var(--card); color: #fff; border: 1px solid var(--card-border);
    display: flex; flex-direction: column; align-items: flex-start; padding: 10px 12px; gap: 3px;
  }
  .btn-mode.active {
    background: var(--accent-bg); border-color: var(--accent); color: var(--accent);
  }
  .btn-mode .sub { font-size: 11px; font-weight: 400; color: var(--muted); }
  .btn-mode.active .sub { color: rgba(255, 159, 10, 0.8); }

  /* Input row */
  .input-row {
    display: flex; gap: 8px; align-items: center;
  }
  input[type="text"], input[type="number"] {
    background: #000; border: 1px solid var(--card-border); color: #fff;
    padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 600;
    font-family: ui-monospace, Menlo, monospace; flex: 1; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .btn-action {
    background: var(--accent); color: #000; font-weight: 700; padding: 12px 18px;
    white-space: nowrap;
  }
  .btn-alt {
    background: var(--card); color: #fff; border: 1px solid var(--card-border);
  }

  /* Preset pills */
  .pill-row {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
  }
  .preset-pill {
    background: var(--card); color: #ddd; font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--card-border);
    white-space: nowrap;
  }
  .preset-pill.active { background: var(--accent); color: #000; border-color: var(--accent); }

  /* Giant Hero Remote Lock Button */
  .hero-lock-btn {
    width: 100%; border-radius: 20px; padding: 18px 20px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    border: 2px solid transparent; text-align: left;
  }
  .hero-lock-btn:active { transform: scale(0.975); }

  .hero-lock-btn.unlocked {
    background: linear-gradient(135deg, #ff9f0a 0%, #d87600 100%);
    color: #000;
    box-shadow: 0 8px 28px rgba(255, 159, 10, 0.42), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    border-color: rgba(255, 255, 255, 0.35);
  }
  .hero-lock-btn.unlocked .svg-lock { display: block; }
  .hero-lock-btn.unlocked .svg-unlock { display: none; }

  .hero-lock-btn.locked {
    background: linear-gradient(135deg, #ff453a 0%, #b81b12 100%);
    color: #fff;
    box-shadow: 0 8px 32px rgba(255, 69, 58, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    border-color: rgba(255, 255, 255, 0.4);
    animation: lockPulse 2s infinite ease-in-out;
  }
  .hero-lock-btn.locked .svg-lock { display: none; }
  .hero-lock-btn.locked .svg-unlock { display: block; }

  @keyframes lockPulse {
    0%, 100% { box-shadow: 0 8px 30px rgba(255, 69, 58, 0.5); }
    50% { box-shadow: 0 8px 42px rgba(255, 69, 58, 0.8), 0 0 20px rgba(255, 69, 58, 0.6); }
  }

  .hero-lock-left {
    display: flex; align-items: center; gap: 16px; min-width: 0;
  }
  .hero-lock-icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: rgba(0, 0, 0, 0.16); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .hero-lock-btn.locked .hero-lock-icon {
    background: rgba(255, 255, 255, 0.2);
  }
  .hero-lock-icon svg {
    width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }
  .hero-lock-content {
    display: flex; flex-direction: column; gap: 3px; min-width: 0;
  }
  .hero-lock-title {
    font-size: 20px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.15;
  }
  .hero-lock-sub {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; opacity: 0.9;
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hero-lock-badge {
    padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 800;
    letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0;
  }
  .hero-lock-btn.unlocked .hero-lock-badge {
    background: rgba(0, 0, 0, 0.25); color: #000;
  }
  .hero-lock-btn.locked .hero-lock-badge {
    background: rgba(255, 255, 255, 0.28); color: #fff;
  }

  /* Quick Actions */
  .action-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .action-btn {
    background: var(--card); color: #fff; border: 1px solid var(--card-border);
    padding: 10px 6px; border-radius: 12px; font-size: 12px; display: flex; flex-direction: column;
    align-items: center; gap: 5px; text-align: center;
  }
  .action-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }
  .action-btn.lock { color: var(--accent); }
  .action-btn.buzz { color: #5ac8fa; }
  .action-btn.clear { color: var(--red); }

  /* Modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--card-border); border-radius: 20px;
    padding: 24px; max-width: 340px; width: 100%; text-align: center; display: flex;
    flex-direction: column; align-items: center; gap: 14px;
  }
  #qrBox { background: #fff; padding: 12px; border-radius: 14px; line-height: 0; }
  #qrBox img, #qrBox canvas { width: 200px !important; height: 200px !important; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Aura Controller</h1>
    <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">
      Room: <b id="roomCodeDisplay" style="color: #fff; letter-spacing: 1px;">ROB52</b>
      <span id="editRoomBtn" style="color: var(--accent); cursor: pointer; margin-left: 6px;">[Change]</span>
    </div>
  </div>
  <div class="status-pill waiting" id="statusPill">
    <span class="dot"></span>
    <span id="statusText">Waiting...</span>
  </div>
</header>

<!-- Giant Remote Lock Button (Hero trigger at top - hard to miss) -->
<button class="hero-lock-btn unlocked" id="heroLockBtn">
  <div class="hero-lock-left">
    <div class="hero-lock-icon">
      <svg class="svg-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <svg class="svg-unlock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
    </div>
    <div class="hero-lock-content">
      <div class="hero-lock-title" id="heroLockTitle">LOCK SPECTATOR</div>
      <div class="hero-lock-sub" id="heroLockSub">ARM FORCE &amp; SHOW KEYPAD HINT</div>
    </div>
  </div>
  <div class="hero-lock-badge" id="heroLockBadge">ARM</div>
</button>

<!-- Live Spectator Peek -->
<div class="card">
  <div class="card-title">
    <span>Spectator Screen Peek</span>
    <span id="latencyDisplay" style="font-size: 11px; text-transform: none; color: var(--green);">-- ms</span>
  </div>
  <div class="peek-screen">
    <div style="display: flex; justify-content: space-between; align-items: center; position: absolute; top: 10px; left: 12px; right: 12px;">
      <span class="peek-tag unlocked" id="peekLockTag">Unlocked</span>
      <span class="peek-hint-tag" id="peekHintTag" style="display:none; font-size: 11px; font-weight: 700; color: var(--accent); background: rgba(255, 159, 10, 0.18); padding: 3px 8px; border-radius: 6px; letter-spacing: 0.05em;">HINT: ARMED</span>
    </div>
    <div class="peek-sec" id="peekSecondary">0</div>
    <div class="peek-prim" id="peekPrimary">0</div>
  </div>
  <div id="controllerInjectRow" style="display:none;align-items:center;justify-content:space-between;background:rgba(48,209,88,0.12);border:1px solid rgba(48,209,88,0.3);border-radius:10px;padding:8px 12px;margin-top:4px;">
    <div style="display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;">
      <span style="font-size:12px;">📡</span>
      <span style="font:700 11px ui-monospace,monospace;color:var(--green);">INJECT:</span>
      <span id="ctrlInjectText" style="font:600 13px -apple-system,sans-serif;color:#fff;overflow:hidden;text-overflow:ellipsis;"></span>
    </div>
    <span id="ctrlInjectCost" style="font:700 12px ui-monospace,monospace;color:var(--accent);white-space:nowrap;"></span>
  </div>
</div>

<!-- Force & Mode Configuration -->
<div class="card">
  <div class="card-title">Mode Selection</div>
  <div class="btn-grid">
    <button class="btn-mode active" data-mode="2" id="modeTimeBtn">
      <span>Date + Time</span>
      <span class="sub" id="modeTimeSub">+30s</span>
    </button>
    <button class="btn-mode" data-mode="1" id="modeFixedBtn">
      <span>Fixed Number</span>
      <span class="sub" id="modeFixedSub">6417118</span>
    </button>
    <button class="btn-mode" data-mode="0" id="modeOffBtn">
      <span>Normal / Off</span>
      <span class="sub">No force</span>
    </button>
  </div>
</div>

<!-- Fixed Number Input -->
<div class="card" id="fixedCard">
  <div class="card-title">Fixed Force Number</div>
  <div class="input-row">
    <input type="text" id="fixedInput" value="6417118" inputmode="numeric" placeholder="6417118">
    <button class="btn-action" id="applyFixedBtn">Set Force</button>
  </div>
  <div class="pill-row">
    <button class="preset-pill active" data-val="6417118">6417118</button>
    <button class="preset-pill" data-val="12345">12345</button>
    <button class="preset-pill" data-val="999999">999999</button>
    <button class="preset-pill" data-val="52">52</button>
  </div>
</div>

<!-- Time Offset Steppers -->
<div class="card" id="offsetCard">
  <div class="card-title">Time Offset Preset</div>
  <div class="pill-row">
    <button class="preset-pill" data-sec="0">+0s</button>
    <button class="preset-pill" data-sec="15">+15s</button>
    <button class="preset-pill active" data-sec="30">+30s</button>
    <button class="preset-pill" data-sec="45">+45s</button>
    <button class="preset-pill" data-sec="60">+1m</button>
    <button class="preset-pill" data-sec="120">+2m</button>
  </div>
</div>

<!-- Remote Covert Actions -->
<div class="card">
  <div class="card-title">Remote Covert Actions</div>
  <div class="action-grid" style="grid-template-columns: repeat(2, 1fr);">
    <button class="action-btn" id="remoteHintBtn" style="color: var(--accent);">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="4 4"/></svg>
      <span>Toggle Hint</span>
    </button>
    <button class="action-btn clear" id="remoteClearBtn">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      <span>AC Clear</span>
    </button>
  </div>
</div>

<!-- NFC / QR Setup Card -->
<div class="card">
  <div class="card-title">NFC Tag / Link Setup</div>
  <div class="input-row">
    <input type="text" id="shareUrlIn" readonly style="font-size: 13px; font-weight: 400; color: var(--muted);">
    <button class="btn-alt" id="copyUrlBtn">Copy</button>
    <button class="btn-alt" id="showQrBtn">QR</button>
  </div>
</div>

<!-- QR Modal -->
<div class="modal" id="qrModal">
  <div class="modal-box">
    <h3 style="font-size: 17px;">Scan Spectator Calculator</h3>
    <div id="qrBox"></div>
    <div style="font-size: 13px; color: var(--muted); word-break: break-all;" id="qrUrlLabel"></div>
    <button class="btn-alt" style="width: 100%;" onclick="closeQr()">Done</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const AURA_LINK_PREFIX = "aura-calc-v1-";
  let roomCode = (localStorage.getItem("aura.controller.room") || "ROB52").toUpperCase();
  let peer = null;
  let conn = null;
  let isSpectatorLocked = false;
  let currentMode = 2;
  let currentOffset = 30;
  let currentFixed = 6417118;

  const $ = (id) => document.getElementById(id);

  // Aura native haptics wrapper
  const haptic = {
    tap() { try { window.Aura ? Aura.haptic("selection") : (navigator.vibrate && navigator.vibrate(8)); } catch(_) {} },
    impact(style = "medium") { try { window.Aura ? Aura.haptic("impact", { style }) : (navigator.vibrate && navigator.vibrate(20)); } catch(_) {} },
    success() { try { window.Aura ? Aura.haptic("notification", { style: "success" }) : (navigator.vibrate && navigator.vibrate([30, 60, 30])); } catch(_) {} },
    error() { try { window.Aura ? Aura.haptic("notification", { style: "error" }) : (navigator.vibrate && navigator.vibrate([60, 40, 60])); } catch(_) {} }
  };

  function updateLockUI(locked, hintActive, hintText) {
    isSpectatorLocked = !!locked;
    const btn = $("heroLockBtn");
    const title = $("heroLockTitle");
    const sub = $("heroLockSub");
    const badge = $("heroLockBadge");
    const tag = $("peekLockTag");
    const hintTag = $("peekHintTag");

    if (isSpectatorLocked) {
      btn.className = "hero-lock-btn locked";
      title.textContent = "LOCKED • TAP TO UNLOCK";
      sub.textContent = hintActive ? `KEYPAD HINT ACTIVE (${hintText || "ARMED"})` : "SPECTATOR LOCKED • FORCE READY";
      badge.textContent = "LOCKED";
      tag.className = "peek-tag locked";
      tag.textContent = "Locked";
    } else {
      btn.className = "hero-lock-btn unlocked";
      title.textContent = "LOCK SPECTATOR";
      sub.textContent = "ARM FORCE & SHOW KEYPAD HINT";
      badge.textContent = "ARM";
      tag.className = "peek-tag unlocked";
      tag.textContent = "Unlocked";
    }

    if (hintTag) {
      if (hintText && (hintActive || isSpectatorLocked)) {
        hintTag.style.display = "inline-block";
        hintTag.textContent = "HINT: " + hintText;
      } else {
        hintTag.style.display = "none";
      }
    }
  }

  async function fetchCloudInjectPeek() {
    try {
      const res = await fetch("https://smartcalc-backend-el0f.onrender.com/api/config?t=" + Date.now(), { cache: "no-store" });
      const data = await res.json();
      if (data && data.injectInput) {
        const row = $("controllerInjectRow");
        const txt = $("ctrlInjectText");
        const cost = $("ctrlInjectCost");
        if (row && txt) {
          row.style.display = "flex";
          txt.textContent = `"${data.injectInput}"`;
          if (cost) cost.textContent = data.injectPrice ? `$${Number(data.injectPrice).toLocaleString()}` : "";
        }
      }
    } catch(_) {}
  }
  fetchCloudInjectPeek();
  setInterval(fetchCloudInjectPeek, 3500);

  async function syncActiveRoomToCloud(code) {
    try {
      await fetch("https://smartcalc-backend-el0f.onrender.com/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ activeRoom: code })
      });
    } catch(e) {
      console.warn("Could not sync activeRoom to cloud:", e);
    }
  }

  function updateRoomUI() {
    $("roomCodeDisplay").textContent = roomCode;
    const base = "https://smartcalc-zeta.vercel.app/#" + roomCode;
    $("shareUrlIn").value = base;
    $("qrUrlLabel").textContent = base;
  }

  const AURA_PEER_CONFIG = {
    debug: 1,
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" },
        { urls: "stun:stun.cloudflare.com:3478" }
      ]
    }
  };

  let pingTimer = null;
  let guestPollTimer = null;

  function setStatus(online, text) {
    const pill = $("statusPill");
    pill.className = "status-pill " + (online ? "online" : "waiting");
    $("statusText").textContent = text;
  }

  function startHost() {
    clearInterval(pingTimer);
    clearInterval(guestPollTimer);
    if (conn) {
      try { conn.close(); } catch(_) {}
      conn = null;
    }
    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch(_) {}
      peer = null;
    }
    setStatus(false, "Starting host...");
    const hostPeerId = AURA_LINK_PREFIX + roomCode;
    const targetGuestId = AURA_LINK_PREFIX + "guest-" + roomCode;

    try {
      peer = new Peer(hostPeerId, AURA_PEER_CONFIG);
      peer.on("open", () => {
        setStatus(false, "Waiting for spectator...");
        syncActiveRoomToCloud(roomCode);
        // If spectator opened first, connect to spectator directly!
        startGuestConnectLoop(targetGuestId);
      });

      peer.on("disconnected", () => {
        if (peer && !peer.destroyed) {
          try { peer.reconnect(); } catch(_) {}
        }
      });

      peer.on("connection", (c) => {
        if (conn && conn.open && conn !== c) {
          try { c.close(); } catch(_) {}
          return;
        }
        clearInterval(guestPollTimer);
        attachConn(c);
      });

      peer.on("error", (err) => {
        console.warn("Peer host error:", err.type || err);
        if (err.type === "unavailable-id") {
          // If host slot is occupied (spectator or calc already opened it), bind guest slot and connect to host!
          if (peer && !peer.destroyed) {
            try { peer.destroy(); } catch(_) {}
          }
          startGuestAsController();
        }
      });
    } catch(e) {
      console.error("Host error:", e);
    }
  }

  function startGuestAsController() {
    setStatus(false, "Connecting to calculator...");
    const guestPeerId = AURA_LINK_PREFIX + "guest-" + roomCode;
    const targetHostId = AURA_LINK_PREFIX + roomCode;

    try {
      peer = new Peer(guestPeerId, AURA_PEER_CONFIG);
      peer.on("open", () => {
        startGuestConnectLoop(targetHostId);
      });
      peer.on("connection", (c) => {
        if (conn && conn.open && conn !== c) {
          try { c.close(); } catch(_) {}
          return;
        }
        clearInterval(guestPollTimer);
        attachConn(c);
      });
      peer.on("error", (err) => {
        console.warn("Guest controller error:", err);
        setTimeout(startHost, 2500);
      });
    } catch(e) {
      setTimeout(startHost, 2500);
    }
  }

  function startGuestConnectLoop(targetGuestId) {
    clearInterval(guestPollTimer);
    const tryConnectGuest = () => {
      if (conn && conn.open) {
        clearInterval(guestPollTimer);
        return;
      }
      if (!peer || peer.destroyed) return;
      try {
        const c = peer.connect(targetGuestId, { reliable: true });
        attachConn(c);
      } catch(_) {}
    };

    tryConnectGuest();
    guestPollTimer = setInterval(tryConnectGuest, 2500);
  }

  function attachConn(c) {
    if (!c) return;
    conn = c;
    c.on("open", () => {
      clearInterval(guestPollTimer);
      setStatus(true, "Linked");
      haptic.success();
      sendCurrentSettings();
      clearInterval(pingTimer);
      pingTimer = setInterval(ping, 2500);
      ping();
    });

    c.on("data", (data) => {
      if (!data || typeof data !== "object") return;
      if (data.t === "display" || data.t === "hello") {
        $("peekPrimary").textContent = data.primary || "0";
        $("peekSecondary").textContent = data.secondary || "";
        updateLockUI(!!data.locked, !!data.camouHint, data.hint || "");
        haptic.impact("light");
      } else if (data.t === "pong") {
        const ms = Math.round(performance.now() - data.ts);
        $("latencyDisplay").textContent = ms + " ms";
      } else if (data.t === "ping") {
        send({ t: "pong", ts: data.ts });
      }
    });

    c.on("close", () => {
      clearInterval(pingTimer);
      conn = null;
      setStatus(false, "Waiting for spectator...");
      updateLockUI(false, false, "");
      haptic.error();
      if (peer && !peer.destroyed) {
        startGuestConnectLoop(AURA_LINK_PREFIX + "guest-" + roomCode);
      }
    });

    c.on("error", (err) => {
      console.warn("Connection error:", err);
      clearInterval(pingTimer);
      conn = null;
      setStatus(false, "Waiting for spectator...");
      updateLockUI(false, false, "");
      if (peer && !peer.destroyed) {
        startGuestConnectLoop(AURA_LINK_PREFIX + "guest-" + roomCode);
      }
    });
  }

  function send(data) {
    if (conn && conn.open) {
      try { conn.send(data); } catch(_) {}
    }
  }

  function ping() {
    send({ t: "ping", ts: performance.now() });
  }

  function sendCurrentSettings() {
    send({
      t: "set",
      mode: currentMode,
      fixed: currentFixed,
      offset: currentOffset
    });
  }

  // UI Event Handlers
  $("modeTimeBtn").onclick = () => {
    currentMode = 2;
    updateModeButtons();
    sendCurrentSettings();
    haptic.tap();
  };
  $("modeFixedBtn").onclick = () => {
    currentMode = 1;
    updateModeButtons();
    sendCurrentSettings();
    haptic.tap();
  };
  $("modeOffBtn").onclick = () => {
    currentMode = 0;
    updateModeButtons();
    sendCurrentSettings();
    haptic.tap();
  };

  function updateModeButtons() {
    document.querySelectorAll(".btn-mode").forEach(b => {
      b.classList.toggle("active", Number(b.dataset.mode) === currentMode);
    });
  }

  $("applyFixedBtn").onclick = () => {
    const val = $("fixedInput").value.trim();
    if (val) {
      currentFixed = isNaN(Number(val)) ? val : Number(val);
      $("modeFixedSub").textContent = String(currentFixed);
      currentMode = 1;
      updateModeButtons();
      sendCurrentSettings();
      haptic.impact("medium");
    }
  };

  document.querySelectorAll("#fixedCard .preset-pill").forEach(p => {
    p.onclick = () => {
      document.querySelectorAll("#fixedCard .preset-pill").forEach(el => el.classList.remove("active"));
      p.classList.add("active");
      $("fixedInput").value = p.dataset.val;
      currentFixed = Number(p.dataset.val);
      $("modeFixedSub").textContent = String(currentFixed);
      currentMode = 1;
      updateModeButtons();
      sendCurrentSettings();
      haptic.tap();
    };
  });

  document.querySelectorAll("#offsetCard .preset-pill").forEach(p => {
    p.onclick = () => {
      document.querySelectorAll("#offsetCard .preset-pill").forEach(el => el.classList.remove("active"));
      p.classList.add("active");
      currentOffset = Number(p.dataset.sec);
      const mins = Math.floor(currentOffset / 60);
      const secs = currentOffset % 60;
      $("modeTimeSub").textContent = `+${mins ? mins + "m " : ""}${secs}s`;
      currentMode = 2;
      updateModeButtons();
      sendCurrentSettings();
      haptic.tap();
    };
  });

  $("heroLockBtn").onclick = () => {
    if (isSpectatorLocked) {
      send({ t: "unlock" });
      haptic.tap();
      updateLockUI(false, false, "");
    } else {
      send({ t: "lock" });
      haptic.impact("heavy");
      updateLockUI(true, true, "ARMED");
    }
  };

  $("remoteHintBtn").onclick = () => {
    send({ t: "toggle_hint" });
    haptic.tap();
  };
  $("remoteClearBtn").onclick = () => {
    send({ t: "reset" });
    haptic.tap();
  };

  window.addEventListener("beforeunload", () => {
    if (conn) { try { conn.close(); } catch(_) {} }
    if (peer) { try { peer.destroy(); } catch(_) {} }
  });
  window.addEventListener("pagehide", () => {
    if (conn) { try { conn.close(); } catch(_) {} }
    if (peer) { try { peer.destroy(); } catch(_) {} }
  });

  $("copyUrlBtn").onclick = () => {
    const u = $("shareUrlIn").value;
    navigator.clipboard.writeText(u).then(() => {
      $("copyUrlBtn").textContent = "Copied!";
      setTimeout(() => $("copyUrlBtn").textContent = "Copy", 1500);
      haptic.success();
    });
  };

  $("showQrBtn").onclick = () => {
    $("qrModal").classList.add("open");
    $("qrBox").innerHTML = "";
    if (window.QRCode) {
      new QRCode($("qrBox"), {
        text: $("shareUrlIn").value,
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.M
      });
    }
    haptic.tap();
  };
  window.closeQr = () => {
    $("qrModal").classList.remove("open");
    haptic.tap();
  };

  $("editRoomBtn").onclick = () => {
    const custom = prompt("Enter custom Room Code for NFC/Spectator link (e.g. ROB52):", roomCode);
    if (custom && custom.trim()) {
      roomCode = custom.trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10);
      localStorage.setItem("aura.controller.room", roomCode);
      updateRoomUI();
      startHost();
    }
  };

  updateRoomUI();
  startHost();
})();
</script>
</body>
</html>
